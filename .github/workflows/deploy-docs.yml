name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/core/src/**'
      - 'packages/core/tokens-src/**'
      - 'packages/core/scripts/**'
      - 'packages/core/package.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── @tdgs/core doit être buildé avant les docs : la page
      #    playground.astro sert le CSS réel via public/tds/ (copié depuis
      #    packages/core/dist par le script prebuild de apps/docs).
      - name: Build core
        run: pnpm --filter @tdgs/core build

      - name: Build docs
        run: pnpm --filter tds-docs build
        env:
          SITE_URL: https://wargafu.github.io
          BASE_PATH: /TDS

      - name: Check generated links and assets
        run: pnpm --filter tds-docs check:links
        env:
          BASE_PATH: /TDS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
