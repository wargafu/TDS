name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks — workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build core
        run: pnpm --filter @tdgs/core build

      # ── Type safety and package builds ─────────────────────────
      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      # ── Token and export validation ────────────────────────────
      - name: Validate core
        run: pnpm --filter @tdgs/core validate

      # ── Tests ───────────────────────────────────────────────────
      - name: Test workspace
        run: pnpm test

      - name: Lint TypeScript workspace
        run: pnpm lint

      # ── CSS quality (duplicate props, tds- naming convention) ──
      - name: Lint CSS
        run: pnpm lint:css

      - name: Validate templates
        run: pnpm validate:templates

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── @tdgs/core doit être buildé avant les docs : la page
      #    playground.astro sert le CSS réel via public/tds/ (copié depuis
      #    packages/core/dist par le script prebuild de apps/docs).
      - name: Build core
        run: pnpm --filter @tdgs/core build

      - name: Build docs
        run: pnpm --filter tds-docs build

      - name: Check documentation performance budget
        run: pnpm --filter tds-docs check:performance

      - name: Install Chromium for accessibility tests
        run: pnpm --filter tds-docs exec puppeteer browsers install chrome

      # ── Accessibilité automatisée (axe-core + Puppeteer) ───────
      - name: Test accessibility
        run: pnpm --filter tds-docs test:a11y

  publish:
    name: Publish (release only)
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @tdgs/core build
          pnpm --filter @tdgs/react build
          pnpm --filter @tdgs/vue build

      - name: Publish @tdgs/core
        run: npm publish --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tdgs/react
        run: npm publish --access public
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tdgs/vue
        run: npm publish --access public
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
