name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  lint:
    name: Lint & formatage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:css

  build-test:
    name: Build, types, tests & validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Valider @tdgs/core (tokens + exports)
        run: pnpm --filter @tdgs/core validate
      - name: Valider les templates
        run: pnpm validate:templates

  docs:
    name: Documentation (build + perf + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-docs-${{ github.sha }}
          restore-keys: turbo-docs-
      - run: pnpm install --frozen-lockfile
      # @tdgs/core doit être buildé avant les docs : playground.astro sert le CSS
      # réel via public/tds/ (copié depuis packages/core/dist par le prebuild docs).
      - name: Build @tdgs/core
        run: pnpm --filter @tdgs/core build
      - name: Build docs
        run: pnpm --filter tds-docs build
      - name: Budget de performance de la documentation
        run: pnpm --filter tds-docs check:performance
      - name: Installer Chromium pour les tests d'accessibilité
        run: pnpm --filter tds-docs exec puppeteer browsers install chrome
      - name: Tests d'accessibilité automatisés (axe-core)
        run: pnpm --filter tds-docs test:a11y

# La publication npm est volontairement retirée de ce workflow. Un workflow de
# release dédié (déclenchement manuel, dry-run vérifié) sera ajouté en phase 5.
