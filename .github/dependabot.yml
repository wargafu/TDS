version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      dev-tooling:
        patterns:
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'prettier'
          - 'stylelint*'
          - 'vitest'
          - 'turbo'
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'astro-expressive-code'
      types:
        patterns:
          - '@types/*'
    ignore:
      # Montées majeures traitées manuellement (voir VERSIONING.md).
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
